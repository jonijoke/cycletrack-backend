
services:
  db:
      image: postgres:18-alpine
      container_name: cycletrack_db
      environment:
        POSTGRES_USER: "${POSTGRES_USER:-postgres}"
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-salasana}"
        POSTGRES_DB: "${POSTGRES_DB:-cycletrack}"
      ports:
        - "${DB_PORT:-5433}:5432"
      volumes:
        - cycletrack_data:/var/lib/postgresql
        - ./docker/init:/docker-entrypoint-initdb.d
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres" ]
        interval: 5s
        timeout: 5s
        retries: 10
volumes:
    cycletrack_data: